<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MacIDM</title>
  <style>
    :root { color-scheme: light dark; font: 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    body { margin: 0; width: 280px; padding: 10px; }
    h1 { font-size: 13px; font-weight: 600; margin: 2px 6px 8px; opacity: .7; }
    button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px;
      background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    button:hover { background: rgba(127,127,127,.15); }
    button .icon { width: 22px; text-align: center; font-size: 16px; }
    button small { display: block; opacity: .6; font-size: 11px; }
    .hidden { display: none; }
    #status { margin: 6px 8px 2px; font-size: 11.5px; opacity: .7; min-height: 14px; }
    hr { border: 0; border-top: 1px solid rgba(127,127,127,.25); margin: 6px 4px; }
  </style>
</head>
<body>
  <h1>MacIDM</h1>
  <button id="images"><span class="icon">🖼</span><span>Grab images from this page<small>Works even where right-click is blocked · ⌥⇧I</small></span></button>
  <button id="pinterest" class="hidden"><span class="icon">📌</span><span id="pinterestLabel">Download this board<small>All images and videos, original size</small></span></button>
  <hr>
  <button id="options"><span class="icon">⚙︎</span><span>Extension options</span></button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>

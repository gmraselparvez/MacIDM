<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MacIDM Options</title>
  <style>
    :root { color-scheme: light dark; font: 13px -apple-system, system-ui, sans-serif; }
    body { margin: 16px; min-width: 380px; }
    label { display: block; margin: 10px 0 4px; }
    textarea { width: 100%; height: 60px; font: inherit; box-sizing: border-box; }
    input[type=number] { width: 70px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    #status { color: gray; }
    .ok { color: #2a8a2a !important; } .bad { color: #c0392b !important; }
    h2 { font-size: 13px; margin: 18px 0 6px; }
    .shortcut { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .shortcut .name { flex: 1; }
    .keys { min-width: 64px; padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(127,127,127,.4);
      text-align: center; font: 13px -apple-system, system-ui, sans-serif; }
    .keys.recording { border-color: #1f6fe5; color: #1f6fe5; }
    .hint { font-size: 11.5px; opacity: .7; margin: 4px 0 0; }
  </style>
</head>
<body>
  <label><input type="checkbox" id="videoButton"> Show a “Download this video” button on videos</label>
  <label><input type="checkbox" id="autoCapture"> Send matching browser downloads to MacIDM</label>
  <label for="extensions">File types to capture</label>
  <textarea id="extensions"></textarea>
  <label>Only files larger than <input type="number" id="minSizeMB" min="0"> MB (when the size is known)</label>
  <h2>Shortcuts</h2>
  <div class="shortcut"><span class="name">Download Pinterest board or pin</span>
    <span class="keys" id="keys-shortcutPinterest"></span>
    <button data-record="shortcutPinterest">Change</button><button data-reset="shortcutPinterest">Reset</button></div>
  <div class="shortcut"><span class="name">Grab images from the page</span>
    <span class="keys" id="keys-shortcutGrabber"></span>
    <button data-record="shortcutGrabber">Change</button><button data-reset="shortcutGrabber">Reset</button></div>
  <p class="hint" id="shortcutHint">Click Change, then press the new keys (use ⌥, ⌃ or ⌘ with a letter, or an F-key). These work on web pages.
    <a href="#" id="chromeShortcuts">Chrome's own extension shortcuts</a> can be set too.</p>
  <div class="row">
    <button id="test">Test connection</button>
    <span id="status"></span>
  </div>
  <script src="shortcuts.js"></script>
  <script src="options.js"></script>
</body>
</html>
